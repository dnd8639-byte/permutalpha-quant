# The lab's full test suite on every push, on the oldest and newest supported Python and pandas.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pandas: "pandas>=2.0,<3"
          - python: "3.12"
            pandas: "pandas>=3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.pandas }}" -e .
      - run: python -m unittest discover tests -v
