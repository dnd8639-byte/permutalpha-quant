[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpt-lab"
version = "1.0.0"
description = "Monte Carlo permutation tests for trading strategies: test against shuffled markets before trusting a backtest."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David DeConti" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]
keywords = ["backtesting", "permutation test", "quantitative finance", "overfitting", "statistics"]

[project.optional-dependencies]
fast = ["scipy>=1.10"]
ml = ["scikit-learn>=1.3"]
data = ["ccxt>=4.0"]
all = ["scipy>=1.10", "scikit-learn>=1.3", "ccxt>=4.0"]

[tool.setuptools]
packages = ["mcptlab"]
